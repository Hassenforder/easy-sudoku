[versions]
hassenforder-android = "1.1.15"

dagger = "2.60.1"
hilt = "1.4.0"
ksp = "2.3.14"
agp = "9.5.1"
kotlin = "2.4.21"
coroutine = "1.11.0"
coreKtx = "1.19.1"
accompanist-permissions = "0.37.3"
datetime = "0.8.0"

# app config used only in app/build.gradle.kts file
kotlinCompose = "1.5.15"
java = "21"
compileSdk = "37"
minSdk = "33"
targetSdk = "37"

# Lifecycle
lifecycle = "2.11.1"
activityCompose = "1.13.0"

#UI
composeBom = "2026.11.01"

# Navigation 3
kotlinSerialization = "1.13.0"
navigation3 = "1.2.2"

# Room
room = "2.8.5"

# hilt
hiltNavigation = "1.4.0"

# Image/Media
coil = "2.7.0"

# MLKit
mlkit-text-recognition = "16.0.1"

# image processing
tesseract = "4.9.0"
opencv = "5.1.0"
cameraX = "1.7.0"
camera-guava = "33.8.0-android"

reorderable = "3.1.0"

junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
fr-uha-android = { module = "fr.uha.hassenforder:easy.android", version.ref = "hassenforder-android" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutine" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutine" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlin-metadata = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }

# Lifecycle dependencies
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# UI dependencies
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

# Navigation 3
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinSerialization" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# Room dependencies
room-core = { module = "androidx.room:room-ktx", version.ref = "room" }
room-ksp = { module = "androidx.room:room-compiler", version.ref = "room" }

# hilt dependencies
# work-runtime should be transitively resolved, but safe to add
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "dagger"  }
hilt-navigation = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation"  }
dagger-ksp = { module = "com.google.dagger:hilt-compiler", version.ref = "dagger"  }
hilt-ksp = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt"  }

# Image UI
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil"  }

#reorder library
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

# accompagnist
accompanist-permissions = { module="com.google.accompanist:accompanist-permissions", version.ref="accompanist-permissions" }

#mlkit
mlkit-text-recognition = { module="com.google.mlkit:text-recognition", version.ref="mlkit-text-recognition" }

# image processing
camera-core = { module = "androidx.camera:camera-core", version.ref ="cameraX" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref ="cameraX" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "cameraX" }
camera-guava = { module = "com.google.guava:guava", version.ref ="camera-guava" }
tesseract = { module = "cz.adaptech.tesseract4android:tesseract4android", version.ref="tesseract" }
opencv = { module = "org.opencv:opencv", version.ref="opencv" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-dagger = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
